name: Deploy admin to cPanel

# Manual only — auto FTP on every push is too slow/unreliable on shared hosting.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build slim deploy folder
        run: |
          mkdir -p deploy_packet
          for d in app bootstrap config database routes resources public; do
            if [ -d "$d" ]; then
              rsync -a --exclude 'uploads' --exclude 'hot' --exclude 'storage' "$d" deploy_packet/
            fi
          done
          cp -f artisan composer.json deploy_packet/ 2>/dev/null || true
          mkdir -p deploy_packet/storage/framework/{cache,sessions,views} deploy_packet/storage/logs deploy_packet/storage/app/public
          touch deploy_packet/storage/logs/.gitkeep

      - name: Deploy slim packet over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 600000
          local-dir: ./deploy_packet/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
