name: Deploy admin to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same plain FTP as aredu-site (FTPS was dropping mid-upload)
      - name: Deploy app code
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 600000
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github/**/*
            .env
            .env.*
            /.env
            vendor/**
            node_modules/**
            tests/**
            docs/**
            html/**
            DB/**
            othersfile/**
            storage/**
            public/uploads/**
            public/hot
            .ftp-deploy-sync-state.json
            phpunit.xml
            README.md
            DEPLOY.md
            fileRunInMac.txt
            package-lock.json
            package.json
            webpack.mix.js
            composer.lock
